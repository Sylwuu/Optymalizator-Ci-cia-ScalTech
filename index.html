<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optymalizator Cięcia Materiału</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>✂️ Optymalizator Cięcia ScalTech</h1>

    <section id="inputSection" class="input-section">
        <h2><span>1.</span> Parametry Wejściowe</h2>
        
        <div class="material-inputs">
            <div class="input-group">
                <label for="totalLength">Długość Materiału (mm)</label>
                <input type="number" id="totalLength" value="6000" oninput="runOptimization()">
            </div>
            <div class="input-group">
                <label for="cutThickness">Grubość Cięcia (mm)</label>
                <input type="number" id="cutThickness" value="1.5" step="0.1" oninput="runOptimization()">
            </div>
        </div>

        <h3>Dodaj grupę elementów</h3>
        <div class="item-row">
            <div class="input-group">
                <label for="newItemLength">Długość (mm)</label>
                <input type="number" id="newItemLength" placeholder="Np. 450">
            </div>
            <div class="input-group">
                 <label for="newItemQuantity">Ilość</label>
                <input type="number" id="newItemQuantity" value="1">
            </div>
            <button onclick="addItemToItems()">Dodaj Grupę</button>
        </div>

        <div id="itemList">
            <!-- Dynamic content -->
        </div>
    </section>

    <section id="outputSection" class="output-section">
        <h2><span>2.</span> Wizualizacja i Wynik</h2>
        
        <canvas id="visualizationCanvas"></canvas>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Długość Stocku</div>
                <div class="stat-value"><span id="totalLengthDisplay">0</span> mm</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Całkowity Odpad</div>
                <div id="wasteResult" class="stat-value" style="color: #ef4444;">0 mm</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Liczba Cięć</div>
                <div id="cutCountResult" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Wykorzystane Profile</div>
                <div id="blocksUsedResult" class="stat-value">0</div>
            </div>
        </div>
    </section>
</div>

<script src="app.js"></script>

</body>
</html>
