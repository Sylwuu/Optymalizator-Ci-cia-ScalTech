<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zaawansowany optymalizator cięcia materiałów ScalTech. Zoptymalizuj zużycie profili i zminimalizuj odpady.">
    <meta name="theme-color" content="#0f172a">
    <title>Optymalizator Cięcia ScalTech | Profesjonalny Dobór Profili</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<main class="container">
    <header>
        <h1><span class="logo-icon">✂️</span> ScalTech <span class="accent">CutList</span></h1>
        <p class="subtitle">Profesjonalna optymalizacja cięcia profili i materiałów</p>
    </header>

    <div class="app-grid">
        <section id="inputSection" class="card input-section">
            <div class="card-header">
                <h2><span>1</span> Parametry Materiału</h2>
            </div>
            
            <div class="material-inputs">
                <div class="input-group">
                    <label for="totalLength">Długość Profili (mm)</label>
                    <input type="number" id="totalLength" value="6000" min="1" step="1" oninput="runOptimization()">
                </div>
                <div class="input-group">
                    <label for="cutThickness">Grubość Rzazu (mm)</label>
                    <input type="number" id="cutThickness" value="1.5" min="0" step="0.1" oninput="runOptimization()">
                </div>
            </div>

            <div class="card-header secondary">
                <h3>Dodaj Elementy do Cięcia</h3>
            </div>
            
            <div class="add-item-form">
                <div class="input-row">
                    <div class="input-group">
                        <label for="newItemLength">Długość (mm)</label>
                        <input type="number" id="newItemLength" placeholder="Np. 1200" min="1">
                    </div>
                    <div class="input-group">
                        <label for="newItemQuantity">Ilość (szt.)</label>
                        <input type="number" id="newItemQuantity" value="1" min="1">
                    </div>
                </div>
                <button id="addBtn" class="btn-primary" onclick="addItemToItems()">
                    <span class="btn-icon">+</span> Dodaj do Listy
                </button>
            </div>

            <div id="itemListContainer" class="item-list-container">
                <div id="itemList" class="item-list">
                    <!-- Dynamic content -->
                </div>
            </div>
        </section>

        <section id="outputSection" class="card output-section">
            <div class="card-header">
                <h2><span>2</span> Wyniki i Wizualizacja</h2>
            </div>
            
            <div class="canvas-wrapper">
                <canvas id="visualizationCanvas"></canvas>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📏</div>
                    <div class="stat-info">
                        <span class="stat-label">Długość Stocku</span>
                        <span class="stat-value"><span id="totalLengthDisplay">0</span> mm</span>
                    </div>
                </div>
                <div class="stat-card waste">
                    <div class="stat-icon">♻️</div>
                    <div class="stat-info">
                        <span class="stat-label">Całkowity Odpad</span>
                        <span id="wasteResult" class="stat-value">0 mm</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔪</div>
                    <div class="stat-info">
                        <span class="stat-label">Liczba Cięć</span>
                        <span id="cutCountResult" class="stat-value">0</span>
                    </div>
                </div>
                <div class="stat-card accent">
                    <div class="stat-icon">📦</div>
                    <div class="stat-info">
                        <span class="stat-label">Użyte Profile</span>
                        <span id="blocksUsedResult" class="stat-value">0</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<footer class="main-footer">
    <p>&copy; 2024 ScalTech Optimization Suite. Wszelkie prawa zastrzeżone.</p>
</footer>

<script src="app.js"></script>

</body>
</html>
